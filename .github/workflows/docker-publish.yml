name: Build and publish Docker images

# 1Panel / 宝塔入驻包使用公开镜像 ghcr.io/<owner>/feedback-web 与 feedback-backend。
# 用法：
#   1) 推送标签 v1.0.0 → 产出镜像 :1.0.0 与 :latest
#   2) 或在 Actions 里手动运行，填 version=1.0.0（无需打 git 标签）
# 镜像仓库使用 GHCR，凭 GITHUB_TOKEN 即可推送，无需额外配置密钥。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签，例如 1.0.0'
        required: true
        default: '1.0.0'
      api_base_url:
        description: '前端 API 基址（留空=同域 /api；分域名时填 https://api.example.com/api）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: feedback-web
            context: ./web
          - name: feedback-backend
            context: ./server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ]; then V="latest"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "镜像版本：$V"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ inputs.api_base_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
